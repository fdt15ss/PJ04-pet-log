# LLM 백엔드 비교 설정 예시
# 사용법: 이 파일을 backends.toml 로 복사한 뒤 값을 채운다.
#
# - 모든 백엔드는 OpenAI 호환 /v1/chat/completions 스트리밍으로 측정한다.
# - API 키는 값을 직접 쓰지 않고 환경변수 이름(api_key_env)만 적는다. 값은 backend/.env 에 둔다.
# - 비용
#   - 하드웨어(RNGD, GPU): usd_per_hour (인스턴스/장비 시간당 단가)
#   - API: input_usd_per_1m, output_usd_per_1m (1M 토큰당 단가)
#   - 단가를 비워 두면 결과표의 비용 칸이 `-` 로 나온다.
# - 비교 모델: RNGD와 GPU 모두 Qwen3 8B로 맞춘다.
# - Qwen3는 thinking 모델이다. 켜 두면 출력 토큰을 추론에 다 써서 답변이 비거나 TTFT 비교가 흐려지므로
#   RNGD와 GPU 모두 chat_template_kwargs.enable_thinking = false 로 끈다.

[[backends]]
name = "rngd"
kind = "npu"
# furiosa-llm serve 로 띄운 서버 주소
base_url = "http://RNGD_HOST:8000/v1"
# RNGD에 올라간 Qwen3 8B의 모델 ID. GET {base_url}/models 응답의 id 값을 그대로 넣는다.
model = "REPLACE_WITH_RNGD_QWEN3_8B_MODEL_ID"
# 서버에 인증이 걸려 있으면 환경변수 이름을 지정한다.
# api_key_env = "RNGD_API_KEY"
# usd_per_hour = 0.0
max_tokens_param = "max_tokens"
temperature = 0.0

[backends.extra_body.chat_template_kwargs]
enable_thinking = false

[[backends]]
name = "gpu"
kind = "gpu"
# vLLM: vllm serve Qwen/Qwen3-8B 로 띄운 서버. RNGD와 같은 BF16 계열 가중치라 공정한 기준선이다.
base_url = "http://GPU_HOST:8000/v1"
model = "Qwen/Qwen3-8B"
# usd_per_hour = 0.0
max_tokens_param = "max_tokens"
temperature = 0.0

[backends.extra_body.chat_template_kwargs]
enable_thinking = false

# 로컬 Ollama로 GPU를 잴 때는 위 gpu 항목 대신 아래 값을 쓴다.
# Ollama qwen3:8b 는 4bit 양자화(Q4_K_M)라 RNGD와 정밀도가 다르다는 점을 결과에 함께 적는다.
#
# [[backends]]
# name = "gpu-ollama"
# kind = "gpu"
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3:8b"
# max_tokens_param = "max_tokens"
# temperature = 0.0
#
# [backends.extra_body]
# # Ollama는 chat_template_kwargs 대신 reasoning_effort = "none" 으로 thinking을 끈다.
# reasoning_effort = "none"

[[backends]]
name = "openai-gpt-5-mini"
kind = "api"
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
api_key_env = "OPENAI_API_KEY"
# 측정 전에 OpenAI 공식 가격표에서 최신 단가를 확인한다.
input_usd_per_1m = 0.25
output_usd_per_1m = 2.00
# gpt-5 계열은 max_tokens 대신 max_completion_tokens 를 쓰고, temperature 변경을 지원하지 않는다.
max_tokens_param = "max_completion_tokens"

[backends.extra_body]
# reasoning 토큰이 TTFT와 출력 토큰 한도를 잡아먹지 않도록 최소로 둔다.
reasoning_effort = "minimal"
